name: Refresh and deploy dashboard

on:
  schedule:
    # One pre-open pass at 08:30 Asia/Shanghai (00:30 UTC).
    - cron: "30 0 * * 1-5"
    # Intraday passes every 20 minutes while Shanghai (01:30-07:00 UTC) or
    # New York (13:30-21:00 UTC) is trading, so quotes stay current.
    - cron: "*/20 1-7,13-20 * * 1-5"
  push:
    branches: [main]
    paths:
      - "semcore/**"
      - "templates/**"
      - "assets/**"
      - "data/**"
      - "content/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the previous snapshot
        uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshots/latest.json
            data/symbols.json
          key: snapshot-${{ github.run_id }}
          restore-keys: |
            snapshot-

      - name: Fetch snapshot and build
        env:
          SITE_URL: https://cxy2696.github.io/semiconductor
        run: |
          python -m semcore refresh --workers 6 || (
            echo "::warning::Live refresh failed; building from the committed snapshot."
            python -m semcore build
          )

      - name: Validate
        run: python -m semcore validate

      - name: Data health summary
        run: python -m semcore status >> "$GITHUB_STEP_SUMMARY"

      - name: Save the snapshot for the next run
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            data/snapshots/latest.json
            data/symbols.json
          key: snapshot-${{ github.run_id }}

      - name: Keep the refreshed snapshot
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: |
            data/snapshots/latest.json
            data/symbols.json
          retention-days: 14
          if-no-files-found: warn

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
