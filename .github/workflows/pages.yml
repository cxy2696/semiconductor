name: Refresh and deploy dashboard

on:
  schedule:
    # 08:30 Asia/Shanghai on weekdays (00:30 UTC)
    - cron: "30 0 * * 1-5"
  push:
    branches: [main]
    paths:
      - "semcore/**"
      - "templates/**"
      - "assets/**"
      - "data/**"
      - "content/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch snapshot and build
        env:
          SITE_URL: https://cxy2696.github.io/semiconductor
        run: |
          python -m semcore refresh --workers 6 || (
            echo "::warning::Live refresh failed; building from the committed snapshot."
            python -m semcore build
          )

      - name: Validate
        run: python -m semcore validate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
