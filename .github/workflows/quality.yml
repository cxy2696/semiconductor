name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate data contracts
        run: python -m semcore validate --data-only

      - name: Run tests
        run: python -m pytest

      - name: Build from committed snapshot
        run: python -m semcore build

      - name: Validate generated site
        run: python -m semcore validate

      - name: Data health summary
        run: python -m semcore status >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated site size
        run: |
          du -sh docs
          find docs -name "*.html" | wc -l
