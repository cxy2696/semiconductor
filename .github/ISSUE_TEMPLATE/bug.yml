name: Bug report
description: Report a broken page, filter, chart or build
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Safari 18 / iPhone 15, Chrome 130 / macOS"
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console output (optional)
