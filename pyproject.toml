[project]
name = "siliconscope"
version = "3.0.0"
description = "Trilingual semiconductor value-chain research desk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jinja2>=3.1,<4", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["semcore*"]
